name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      export-image:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# WP-01 minimal CI: locked dependency sync, Ruff lint/format, pytest.
# Extended checks (image build, browser, security/secret scans) are added by
# their own work packages (WP-06, WP-08).
env:
  UV_PYTHON: "3.12"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            python3 scripts/ci_changes.py "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"
          else
            echo 'docs-only=false' >> "$GITHUB_OUTPUT"
          fi
  foundation:
    name: Foundation (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          version: "0.13.1"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify lockfile is up to date
        run: uv lock --check

      - name: Sync locked environment
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest

      - name: Check Django and migration drift
        run: |
          uv run python manage.py check --settings tests.settings
          uv run python manage.py makemigrations --check --dry-run --settings tests.settings

      - name: Audit locked runtime dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes -o "$RUNNER_TEMP/runtime-requirements.txt"
          uv tool run --from pip-audit==2.10.1 pip-audit --disable-pip --no-deps -r "$RUNNER_TEMP/runtime-requirements.txt"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: browser-npm-${{ runner.os }}-playwright-1.62.1
      - name: Run local-only Playwright smoke
        run: |
          npm install --cache "$HOME/.npm" --prefer-offline --prefix "$RUNNER_TEMP/browser" --no-audit --no-fund --ignore-scripts playwright-core@1.62.1
          NODE_PATH="$RUNNER_TEMP/browser/node_modules" uv run pytest browser/

  windows:
    name: Windows (shared runtime)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
          version: "0.13.1"
      - run: uv sync --locked
      - name: Verify shared runtime and native process limits
        run: uv run pytest tests/test_settings.py tests/test_pdf.py tests/test_processes.py tests/test_release.py tests/test_inventory_contract.py tests/test_backup_inventory_contract.py tests/test_portable_runtime.py tests/test_source_reader.py tests/test_publication_contract.py tests/test_stage_ownership.py tests/test_job_lifecycle.py tests/test_windows_security.py tests/test_windows_root_security.py tests/test_windows_access_security.py tests/test_windows_raw_preflight.py
      - name: Check Django and migration drift
        run: |
          uv run python manage.py check --settings tests.settings
          uv run python manage.py makemigrations --check --dry-run --settings tests.settings

  container:
    name: Container (amd64 + security + synthetic smoke)
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/notenarchiv-build-cache
            ~/scanner-cache
          key: build-scanner-${{ runner.os }}-${{ hashFiles('uv.lock', 'Dockerfile') }}-trivy-0.76.2
      - name: Build pinned non-root image
        env:
          REVISION: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=preview-ci
          if [ "$REF_TYPE" = tag ]; then VERSION="${REF_NAME#v}"; fi
          docker buildx build --platform linux/amd64 --load --provenance=false \
            --cache-from type=local,src=/tmp/notenarchiv-build-cache \
            --cache-to type=local,dest=/tmp/notenarchiv-build-cache-new,mode=max \
            --build-arg VCS_REF="$REVISION" --build-arg APP_VERSION="$VERSION" --tag notenarchiv-ci:verified .
          rm -rf /tmp/notenarchiv-build-cache
          mv /tmp/notenarchiv-build-cache-new /tmp/notenarchiv-build-cache
      - name: Validate Compose configurations
        run: python3 scripts/check_compose.py
      - name: Exercise real container and isolated restore
        run: sudo python3 scripts/container_smoke.py --image notenarchiv-ci:verified
      - name: Exercise actual archive worker publication
        run: sudo python3 -m scripts.publication_smoke --image notenarchiv-ci:verified
      - name: Exercise pinned local OCR with generated synthetic pages
        run: |
          docker run --rm --read-only --network none --memory 768m --cpus 2 --env PYTHONPATH=/app \
            --tmpfs /scratch:rw,mode=700,uid=65532,gid=65532,size=128m \
            --mount type=bind,source="$PWD/scripts/ocr_smoke.py",target=/ocr_smoke.py,readonly \
            --entrypoint python notenarchiv-ci:verified /ocr_smoke.py
      - name: Exercise standalone Synology installation with the published digest
        run: sudo python3 -m scripts.simple_install_smoke --candidate-image notenarchiv-ci:verified
      - name: Install pinned browser driver for full-stack acceptance
        run: npm install --prefix "$RUNNER_TEMP/stack-browser" --no-audit --no-fund --ignore-scripts playwright-core@1.62.1
      - name: Exercise current full Compose stack with private TLS and actual browser
        run: sudo env NODE_PATH="$RUNNER_TEMP/stack-browser/node_modules" python3 -m scripts.synology_stack_smoke --image notenarchiv-ci:verified
      - name: Verify pinned scanner
        run: |
          mkdir -p "$HOME/scanner-cache"
          if [ ! -f "$HOME/scanner-cache/trivy.tar.gz" ]; then
            curl --fail --location --retry 3 -o "$HOME/scanner-cache/trivy.tar.gz" https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz
          fi
          echo "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  $HOME/scanner-cache/trivy.tar.gz" | sha256sum --check
          tar -xzf "$HOME/scanner-cache/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
      - name: Scan image vulnerabilities and secrets
        run: |
          "$RUNNER_TEMP/trivy" image --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 --no-progress notenarchiv-ci:verified
          "$RUNNER_TEMP/trivy" image --format cyclonedx --output image-sbom.cdx.json --no-progress notenarchiv-ci:verified
      - name: Record verified image metadata
        run: docker image inspect notenarchiv-ci:verified > image-metadata.json
      - name: Export verified candidate for release
        if: inputs.export-image == true
        run: docker save notenarchiv-ci:verified -o verified-image.tar
      - name: Upload verified release candidate
        if: inputs.export-image == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-container
          archive: true # Release recovery verifies the complete ZIP archive digest.
          path: |
            verified-image.tar
            image-sbom.cdx.json
            image-metadata.json
          retention-days: 7
      - name: Upload SBOM and image metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-evidence
          archive: true
          path: |
            image-sbom.cdx.json
            image-metadata.json
          retention-days: 30
