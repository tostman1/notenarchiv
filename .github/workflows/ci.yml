name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# WP-01 minimal CI: locked dependency sync, Ruff lint/format, pytest.
# Extended checks (image build, browser, security/secret scans) are added by
# their own work packages (WP-06, WP-08).
env:
  UV_PYTHON: "3.12"

jobs:
  foundation:
    name: Foundation (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"

      - name: Verify lockfile is up to date
        run: uv lock --check

      - name: Sync locked environment
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest

      - name: Run local-only Playwright smoke
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --no-audit --no-fund --ignore-scripts playwright-core@1.62.1
          NODE_PATH="$RUNNER_TEMP/browser/node_modules" uv run pytest browser/
