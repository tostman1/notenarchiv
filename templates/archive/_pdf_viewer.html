{% load static i18n %}
<link rel="stylesheet" href="{% static 'archive/preview.css' %}">
<section id="pdf-preview" data-document-url="{% url 'archive_preview:document' file.id %}"
    data-worker-url="{% static 'vendor/pdfjs/build/pdf.worker.mjs' %}"
    data-assets-url="{% static 'vendor/pdfjs/' %}"
    data-error="{% translate 'Die PDF-Vorschau ist nicht verfügbar. Bitte laden Sie die Seite erneut oder prüfen Sie den Dateistatus.' %}"
    data-loading="{% translate 'PDF wird geladen …' %}" data-ready="{% translate 'PDF-Seite geladen.' %}">
    <div class="preview-controls" aria-label="{% translate 'PDF-Steuerung' %}">
        <button type="button" id="pdf-previous" disabled>{% translate "Vorherige Seite" %}</button>
        <label for="pdf-page">{% translate "Seite" %}</label><input id="pdf-page" type="number" min="1" max="1" value="1" disabled>
        <span>/ <span id="pdf-count">–</span></span>
        <button type="button" id="pdf-next" disabled>{% translate "Nächste Seite" %}</button>
        <label for="pdf-zoom">{% translate "Zoom" %}</label><select id="pdf-zoom" disabled>
            <option value="0.5">50 %</option><option value="0.75">75 %</option><option value="1" selected>100 %</option>
            <option value="1.25">125 %</option><option value="1.5">150 %</option><option value="2">200 %</option>
        </select>
    </div>
    <p id="pdf-status" role="status" aria-live="polite">{% translate "PDF wird geladen …" %}</p>
    <noscript>{% translate "Für die sichere PDF-Vorschau muss JavaScript aktiviert sein." %}</noscript>
    <div class="preview-surface" tabindex="0" aria-label="{% translate 'PDF-Seite' %}">
        <canvas id="pdf-canvas" role="img" aria-label="{% translate 'Gerenderte PDF-Seite' %}"></canvas>
    </div>
</section>
