# Simple first installation: no .env file is required.
# Mandatory edits are grouped below. Keep the default paths for a standard install.
# Use only new empty/synthetic roots; never connect real music without approval.
name: notenarchiv
x-runtime: &runtime
  image: ghcr.io/tostman1/notenarchiv@sha256:e6e01416737702598458af8c9167f2353e09074c445281d640eaa34f10658f4d
  platform: linux/amd64
  # EDIT 1: numeric UID:GID printed by the preparation helper; no guessed IDs.
  user: "CHANGE_UID:CHANGE_GID"
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 64
  mem_limit: 512m
  cpus: 1.0
  tmpfs:
    - /tmp:size=64m,mode=1777
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}
x-app: &app
  <<: *runtime
  environment:
    NOTENARCHIV_PROFILE: nas
    NOTENARCHIV_SERVICE: web
    APP_BIND: 127.0.0.1
    # EDIT 2: private HTTPS hostname; keep localhost/127.0.0.1 for health.
    APP_ALLOWED_HOSTS: notenarchiv.example.invalid,localhost,127.0.0.1
    # EDIT 3: the same hostname, with https:// and no trailing slash.
    APP_CSRF_TRUSTED_ORIGINS: https://notenarchiv.example.invalid
    TZ: Europe/Vienna
    DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
    DATABASE_PATH: /data/notenarchiv.sqlite3
    SOURCE_DIR: /archive/raw
    CURATED_DIR: /archive/clean
    PROCESSED_DIR: /archive/processed
    STATUS_DIR: /archive/status
    EXPORT_DIR: /archive/export
    PRINT_ENABLED: "0"
    # DEBUG_MODE intentionally absent. See compose.debug.yaml.
  # Standard roots prepared by scripts/prepare-install.sh. Advanced paths: INSTALL.md.
  volumes:
    - type: bind
      source: /volume1/docker/notenarchiv/raw
      target: /archive/raw
      read_only: true
      bind: {create_host_path: false}
    - type: bind
      source: /volume1/docker/notenarchiv/clean
      target: /archive/clean
      read_only: true
      bind: {create_host_path: false}
    - type: bind
      source: /volume1/docker/notenarchiv/processed
      target: /archive/processed
      read_only: true
      bind: {create_host_path: false}
    - type: bind
      source: /volume1/docker/notenarchiv/status
      target: /archive/status
      read_only: true
      bind: {create_host_path: false}
    - type: bind
      source: /volume1/docker/notenarchiv/export
      target: /archive/export
      read_only: true
      bind: {create_host_path: false}
    - type: bind
      source: /volume1/docker/notenarchiv/data
      target: /data
      bind: {create_host_path: false}
    - type: bind
      source: /volume1/docker/notenarchiv/secrets/django_secret_key
      target: /run/secrets/django_secret_key
      read_only: true
      bind: {create_host_path: false}
  networks: [backend]

services:
  web:
    <<: *app
    command: [web]
    restart: unless-stopped
  gateway:
    <<: *runtime
    command: [gateway]
    restart: unless-stopped
    mem_limit: 64m
    pids_limit: 64
    cpus: 0.25
    networks: [backend, frontend]
    depends_on:
      web: {condition: service_healthy}
    ports: ["127.0.0.1:8085:8000"]
  migrate:
    <<: *app
    profiles: [tools]
    command: [migrate]
    restart: "no"
    healthcheck: {disable: true}
  admin:
    <<: *app
    profiles: [tools]
    command: [provision]
    stdin_open: true
    tty: true
    restart: "no"
    healthcheck: {disable: true}
    logging: {driver: none}

networks:
  backend:
    internal: true
  frontend: {}
