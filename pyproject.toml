[project]
name = "notenarchiv"
version = "0.1.0"
description = "Local sheet music archive and personal folder generator for a music association (WP-01 foundation; application packages follow)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django==5.2.19",
    "gunicorn==27.0.1",
    "pypdf==7.1.1",
    "pypdfium2==5.15.2",
    "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.1",
    "pytest-django==4.14.0",
    "ruff==0.14.5",
]

[tool.ruff]
target-version = "py312"
line-length = 120
# Generated Django migrations are excluded from lint/format (Django's
# migration serializer does not follow our style conventions).
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # import sorting
    "B", # flake8-bugbear
    "UP", # pyupgrade
    "SIM", # flake8-simplify
    "T20", # print statements
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
DJANGO_SETTINGS_MODULE = "tests.settings"
